<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Diego López Mardomingo · Full-Stack Developer · Salesforce Specialist">
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#89b4fa"/>
      <stop offset="1" stop-color="#cba6f7"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#cba6f7" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#89b4fa" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#89b4fa" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="window"><rect x="0.5" y="0.5" width="1199" height="399" rx="16"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'SFMono-Regular', Menlo, monospace; }
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .fade { animation: fade .6s ease-out both; }
      .d1 { animation-delay: .2s; } .d2 { animation-delay: .7s; } .d3 { animation-delay: 1.1s; }
      .d4 { animation-delay: 1.7s; } .d5 { animation-delay: 2.1s; } .d6 { animation-delay: 2.3s; }
      .d7 { animation-delay: 2.5s; } .d8 { animation-delay: 2.7s; } .d9 { animation-delay: 3.1s; }
      .cursor { animation: fade .6s ease-out 3.1s both, blink 1.1s steps(1) 3.7s infinite; }
      @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <g clip-path="url(#window)">
    <rect width="1200" height="400" fill="#1e1e2e"/>
    <circle cx="1000" cy="230" r="320" fill="url(#glow)"/>
    <rect width="1200" height="44" fill="#181825"/>
    <line x1="0" y1="44" x2="1200" y2="44" stroke="#313244"/>
    <circle cx="28" cy="22" r="6.5" fill="#f38ba8"/>
    <circle cx="50" cy="22" r="6.5" fill="#f9e2af"/>
    <circle cx="72" cy="22" r="6.5" fill="#a6e3a1"/>
    <text x="600" y="27" text-anchor="middle" class="mono" font-size="13" fill="#6c7086">diego@mardomingo: ~</text>

    <!-- decorative code bracket -->
    <text x="1000" y="282" text-anchor="middle" class="mono" font-size="170" font-weight="700" fill="#45475a" opacity="0.55">&lt;/&gt;</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="16" fill="none" stroke="#313244"/>

  <g class="mono" font-size="18">
    <g class="fade d1"><text x="48" y="96"><tspan fill="#a6e3a1">❯</tspan><tspan fill="#cdd6f4" dx="12">whoami</tspan></text></g>
  </g>

  <g class="fade d2"><text x="46" y="160" class="sans" font-size="50" font-weight="700" fill="url(#name)">Diego López Mardomingo</text></g>
  <g class="fade d3"><text x="48" y="200" class="sans" font-size="21" fill="#a6adc8">Full-Stack Developer  ·  Salesforce Specialist  ·  España</text></g>

  <g class="mono" font-size="18">
    <g class="fade d4"><text x="48" y="262"><tspan fill="#a6e3a1">❯</tspan><tspan fill="#cdd6f4" dx="12">ls ~/proyectos</tspan></text></g>
    <g class="fade d5"><text x="48" y="300" fill="#fab387">Submana/</text></g>
    <g class="fade d6"><text x="190" y="300" fill="#94e2d5">Ecos/</text></g>
    <g class="fade d7"><text x="300" y="300" fill="#cba6f7">HubGames/</text></g>
    <g class="fade d8"><text x="450" y="300" fill="#89b4fa">OhMyPosh-Theme/</text></g>
    <g class="fade d9"><text x="48" y="352" fill="#a6e3a1">❯</text></g>
    <rect class="cursor" x="70" y="337" width="10" height="20" fill="#cdd6f4"/>
  </g>
</svg>
